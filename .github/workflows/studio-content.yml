name: Studio content

# For a machine with no internet: run this by hand (Actions > Studio content >
# Run workflow). It downloads Studio's built-in content from Roblox's CDN and
# the part / terrain material textures from asset delivery, the same files
# rustudio fetches on a first launch, and zips them. Copy the zip to
# the offline machine and use File > Import Studio Content… (or
# `rustudio --import-studio-content studio-content.zip`).

on:
  workflow_dispatch:
  # (a fork's workflows are only runnable by hand from the default branch: on
  # another branch, pushing a change to this file runs it, and "Re-run all
  # jobs" on that run runs it again)
  push:
    branches: [fix/launch-guard-opengl-fallback]
    paths: ['.github/workflows/studio-content.yml']

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the downloader
        run: cargo build --release --locked -p rustudio-core --example export_studio_content --example prefetch_packs

      - name: Download Studio's content from Roblox's CDN
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/home"
          # rustudio keeps its downloads under $HOME/.local/share on Linux, so a
          # throwaway HOME (for this one program only) stages exactly that tree.
          HOME="$stage/home" XDG_CACHE_HOME="$stage/cache" \
            XDG_CONFIG_HOME="$stage/config" XDG_STATE_HOME="$stage/state" \
            ./target/release/examples/export_studio_content
          find "$stage/home" -maxdepth 4 | head -20

      - name: Zip it
        id: zip
        run: |
          cd "$RUNNER_TEMP/stage/home/.local/share/rustudio"
          ls -la . studio classic-sounds
          test -f studio/.rustudio-studio-version
          test -f classic-sounds/uuhhh.mp3
          files=$(find studio classic-sounds -type f | wc -l)
          echo "$files files"
          # (rustudio's zip reader has no zip64: a bigger zip must be split)
          test "$files" -lt 60000
          zip -r -q -X "$GITHUB_WORKSPACE/studio-content.zip" studio classic-sounds
          ls -l "$GITHUB_WORKSPACE/studio-content.zip"
          test "$(stat -c %s "$GITHUB_WORKSPACE/studio-content.zip")" -lt 4000000000
          echo "version=$(cut -d' ' -f1 studio/.rustudio-studio-version)" >> "$GITHUB_OUTPUT"

      # Part and terrain material textures are not in Studio's packages: rustudio
      # downloads each material's texture pack from asset delivery on first use
      # and keeps it in its cache. Offline, that cache is empty and every
      # material draws as one flat colour, so fill it here. Two zips (File >
      # Import Studio Content… reads a whole zip into memory).
      - name: Download the part material textures
        run: |
          stage="$RUNNER_TEMP/stage/parts"
          mkdir -p "$stage"
          ids=$(python3 tools/material_pack_ids.py parts)
          RUSTUDIO_CACHE_DIR="$stage/cache" ./target/release/examples/prefetch_packs $ids
          cd "$stage"
          files=$(find cache/assets -type f | wc -l)
          echo "$files files"
          test "$files" -gt 100
          test "$files" -lt 60000
          zip -r -q -X -0 "$GITHUB_WORKSPACE/material-textures-parts.zip" cache/assets
          ls -l "$GITHUB_WORKSPACE/material-textures-parts.zip"
          test "$(stat -c %s "$GITHUB_WORKSPACE/material-textures-parts.zip")" -lt 4000000000

      - name: Download the terrain material textures
        run: |
          stage="$RUNNER_TEMP/stage/terrain"
          mkdir -p "$stage"
          ids=$(python3 tools/material_pack_ids.py terrain)
          RUSTUDIO_CACHE_DIR="$stage/cache" ./target/release/examples/prefetch_packs $ids
          cd "$stage"
          files=$(find cache/assets -type f | wc -l)
          echo "$files files"
          test "$files" -gt 50
          test "$files" -lt 60000
          zip -r -q -X -0 "$GITHUB_WORKSPACE/material-textures-terrain.zip" cache/assets
          ls -l "$GITHUB_WORKSPACE/material-textures-terrain.zip"
          test "$(stat -c %s "$GITHUB_WORKSPACE/material-textures-terrain.zip")" -lt 4000000000

      - name: Keep it as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-content
          path: |
            studio-content.zip
            material-textures-parts.zip
            material-textures-terrain.zip
          compression-level: 0
          retention-days: 30

      # A release asset is one plain .zip (an artifact is a zip around the zip).
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          tag="studio-content-$VERSION"
          gh release create "$tag" studio-content.zip material-textures-parts.zip material-textures-terrain.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Studio content $VERSION" \
            --notes "Roblox Studio's built-in content ($VERSION) for rustudio on a machine with no internet. Download the zips, copy them over, then File > Import Studio Content… for each: studio-content.zip, material-textures-parts.zip, material-textures-terrain.zip" \
            || gh release upload "$tag" studio-content.zip material-textures-parts.zip material-textures-terrain.zip --clobber
